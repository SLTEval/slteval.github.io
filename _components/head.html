<meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="description" content="{{ page.description }}">
  <meta name="keywords" content="{{ site.keywords | join(', ') }}">
  <meta name="robots" content="index, follow, max-image-preview:large">
  <meta name="application-name" content="{{ site.name }} {{ site.year }}">
  <meta name="author" content="{{ site.organizer.name }}">
  <meta name="theme-color" content="#0c2340">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.name }} {{ site.year }}">
  <meta property="og:locale" content="en_US">
  <meta property="og:title" content="{{ page.title }}">
  <meta property="og:description" content="{{ page.social_description }}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{social_image}}">
  <meta property="og:image:secure_url" content="{{social_image}}">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ site.social_image_alt }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title }}">
  <meta name="twitter:description" content="{{ page.social_description }}">
  <meta name="twitter:image" content="{{social_image}}">
  <meta name="twitter:image:alt" content="{{ site.social_image_alt }}">
  <script type="application/ld+json">{{structured_data}}</script>
  <link rel="icon" href="{{root}}favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{root}}assets/favicon.svg">
  <link rel="stylesheet" href="{{root}}assets/vendor/bootstrap-navbar.css">
  <link rel="stylesheet" href="{{root}}assets/css/site.css">
  <script src="{{root}}assets/vendor/bootstrap.bundle.min.js" defer></script>
  <script src="{{root}}assets/js/site.js" defer></script>
